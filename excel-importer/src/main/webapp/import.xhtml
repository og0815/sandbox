<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Excel Import</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <style>
            table { border-collapse: collapse; width: 100%; }
            th, td { border: 1px solid #ddd; padding: 8px; }
        </style>
    </h:head>
    <h:body>
        <div>
            <h1>Excel Importer</h1>
            
            <p>
                <h:link value="Back to Home" outcome="index" />
                <h:link value="View All Properties" outcome="properties" />
            </p>

            <p>Upload an Excel file to compare with existing property data:</p>

            <h:form enctype="multipart/form-data" id="importForm">
                <p:fileUpload name="file" 
                             listener="#{importBean.handleFileUpload}" 
                             auto="true" 
                             multiple="false"
                             accept=".xlsx"
                             update="@form" />
                
                <h:panelGroup id="importMessagePanel" rendered="#{importBean.importMessage != null and importBean.importMessage != ''}">
                    <div style="margin-top: 20px; padding: 15px; background-color: #f0f0f0; border: 1px solid #ddd; border-radius: 4px;">
                        <p style="margin-top: 0; font-weight: bold;">
                            <h:outputText value="Importdatei: " />
                            <h:outputText value="#{importBean.lastImportFileName}" />
                        </p>
                        <p style="margin: 10px 0; font-size: 0.9em; color: #666;">
                            <h:outputText value="Importiert am: " />
                            <h:outputText value="#{importBean.lastImportDateTime}" />
                        </p>
                        <hr style="margin: 15px 0; border: none; border-top: 1px solid #999;" />
                        <h:outputText value="#{importBean.importMessage}" 
                                     escape="false" 
                                     style="white-space: pre-wrap; display: block;" />
                    </div>
                </h:panelGroup>
            </h:form>
        </div>
    </h:body>
</html>
